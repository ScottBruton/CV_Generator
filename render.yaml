services:
  - type: web
    name: cv-generator
    runtime: node
    plan: free
    region: oregon
    branch: main
    # --include=dev: NODE_ENV=production would otherwise skip vite (devDependency) → exit 127
    buildCommand: npm install --include=dev && npm run build && (npx puppeteer browsers install chrome || true)
    startCommand: npm run start:prod
    healthCheckPath: /api/auth/me
    envVars:
      # node:sqlite (DatabaseSync) requires Node 22.5+
      - key: NODE_VERSION
        value: "22.16.0"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: OPEN_AI_MODEL
        value: gpt-5.6-sol
      - key: OPEN_AI_API_KEY
        sync: false
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
